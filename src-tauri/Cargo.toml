[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# 清单（manifest）中更多键及其定义见官方文档：https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` 后缀看似冗余，但它是必要的：
# 它让库名与 bin 名保持唯一、互不冲突；
# 该问题仅出现在 Windows 上，参见 https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zip = "2"
base64 = "0.22"
